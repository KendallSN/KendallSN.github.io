name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Web3Forms key
        run: |
          if [ -z "$PUBLIC_WEB3FORMS_ACCESS_KEY" ]; then
            echo "::error::PUBLIC_WEB3FORMS_ACCESS_KEY is empty. Set it in Settings > Secrets and variables > Actions > Variables (repository variable, not a secret)."
            exit 1
          fi
          echo "Web3Forms key present (${#PUBLIC_WEB3FORMS_ACCESS_KEY} chars)"
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.PUBLIC_WEB3FORMS_ACCESS_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
